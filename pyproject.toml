[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quiz-funnel-runner"
version = "0.1.0"
description = "Async Playwright runner for quiz funnels with screenshot classification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "playwright>=1.45.0",
  "rich>=13.7.0",
  "pydantic>=2.7.0",
  "streamlit>=1.36.0"
]

[project.scripts]
quiz-runner = "quiz_funnel_runner.cli:main"
quiz-runner-ui = "quiz_funnel_runner.ui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quiz_funnel_runner*"]
